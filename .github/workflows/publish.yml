name: Publish to npm

# Trusted Publishing via GitHub Actions OIDC — no NPM_TOKEN secret needed.
# Requires Node 24 / npm 11+ (Node 20's npm cannot mint an OIDC publish token
# and fails with ENEEDAUTH). Matches https://docs.npmjs.com/trusted-publishers/

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish via Trusted Publishing (OIDC)
        run: |
          node --version
          npm --version
          npm publish --provenance --access public
