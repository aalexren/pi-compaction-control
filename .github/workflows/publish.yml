name: Publish to npm

# Trusted Publishing via GitHub Actions OIDC — no NPM_TOKEN secret needed.
# See https://docs.npmjs.com/trusted-publishers/

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (resolved from @v4 on 2026-09-04).
      # persist-credentials: false prevents the artipacked token-leak vector.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org" # required so npm triggers OIDC
          package-manager-cache: false # never cache in release builds

      - name: Debug — Trusted Publishing match info + OIDC token claims
        run: |
          set -euo pipefail
          echo "=== GitHub context (what npm Trusted Publisher must match) ==="
          echo "repository_owner : ${{ github.repository_owner }}"
          echo "repository       : ${{ github.repository }}"
          echo "workflow_ref     : ${{ github.workflow_ref }}"
          echo "ref              : ${{ github.ref }}"
          echo "event_name       : ${{ github.event_name }}"
          echo ""
          echo "=== .npmrc that setup-node wrote ==="
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no userconfig)"
          echo "NODE_AUTH_TOKEN  : ${NODE_AUTH_TOKEN:-<unset>}"
          echo ""
          echo "=== OIDC token payload (audience=npm:registry.npmjs.org) ==="
          python3 -c "
          import json,urllib.request,base64,os
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience=npm:registry.npmjs.org'
          req=urllib.request.Request(url,headers={'Authorization':'bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          tok=json.load(urllib.request.urlopen(req))['value']
          p=tok.split('.')[1]; p+='='*(-len(p)%4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=2))
          "

      - name: Publish via Trusted Publishing (OIDC)
        run: |
          # setup-node@v4 writes .npmrc with _authToken=${NODE_AUTH_TOKEN} and exports
          # NODE_AUTH_TOKEN='XXXXX-XXXXX-XXXXX-XXXXX' (placeholder) when registry-url is set.
          # npm then authenticates with that placeholder instead of minting an OIDC token.
          # Remove the placeholder so `npm publish --provenance` uses OIDC Trusted Publishing.
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          echo "--- .npmrc after clearing placeholder ---"
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no userconfig)"
          echo "NODE_AUTH_TOKEN  : ${NODE_AUTH_TOKEN:-<unset>}"
          npm publish --provenance --access public
